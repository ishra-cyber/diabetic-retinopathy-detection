# ============================================================================
# Central project configuration.
# Every script reads this file; nothing should hard-code a path or a number.
# Edit values here, not inside the code.
# ============================================================================

project:
  name: "Intelligent Diabetic Retinopathy Detection and Progress Monitoring"
  seed: 42                      # global random seed, used everywhere

paths:
  # All paths are relative to the project root (the folder holding this repo).
  data_root: "data"
  raw_dir: "data/raw"                       # untouched Kaggle download
  aptos_dir: "data/raw"                     # folder holding train.csv + train_images/
  interim_dir: "data/interim"               # cached preprocessed images
  processed_dir: "data/processed"
  splits_dir: "data/splits"                 # train/val/test CSVs
  experiments_dir: "experiments"            # checkpoints + metrics per run
  reports_dir: "reports"
  figures_dir: "reports/figures"
  db_path: "app/assets/dr_monitor.sqlite3"  # SQLite patient-visit database
  uploads_dir: "app/assets/uploads"         # images uploaded through the app
  gradcam_dir: "app/assets/gradcam"         # generated Grad-CAM overlays

dataset:
  name: "aptos2019-blindness-detection"     # Kaggle competition slug
  train_csv: "train.csv"                    # inside aptos_dir
  test_csv: "test.csv"
  train_images: "train_images"              # folder name inside aptos_dir
  test_images: "test_images"
  image_ext: ".png"
  id_col: "id_code"
  label_col: "diagnosis"
  num_classes: 5
  class_names:
    0: "No DR"
    1: "Mild"
    2: "Moderate"
    3: "Severe"
    4: "Proliferative DR"
  # Expected counts for the public APTOS 2019 release. Used only as a soft
  # sanity check; a mismatch produces a warning, never a crash.
  expected_train_rows: 3662
  expected_test_rows: 1928

preprocessing:
  # 300x300 is used for ALL THREE architectures so the only variable in the
  # Milestone 6 comparison is the architecture itself (see docs/ARCHITECTURE.md).
  image_size: 300
  crop_black_borders: true
  border_tol: 7                # a pixel is "black" if its grayscale value <= this
  border_min_frac: 0.0         # fraction of a row/col that must be non-black to keep it
  pad_to_square: true          # pad the crop to a square BEFORE resizing (no distortion)
  use_clahe: false             # toggled on/off as an ablation experiment
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
  cache_dir_template: "train_{size}"   # subfolder of data/interim for cached images
  # ImageNet statistics (pretrained backbones expect these)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

split:
  test_size: 0.15
  val_size: 0.15               # fraction of the ORIGINAL data, not of the remainder
  stratify: true

training:
  # Milestone 4/5 override this per experiment via configs/experiments/*.yaml.
  # The three architectures being compared: resnet50, efficientnet_b3, densenet121
  backbone: "efficientnet_b3"
  pretrained: true
  batch_size: 8                # RTX 3050 6GB: 8 fits at 300px with AMP
  grad_accum_steps: 2          # effective batch = batch_size * this
  num_workers: 2               # Windows spawns processes; 2 is the sweet spot
  epochs: 20                  # cosine schedule length; early stopping usually ends sooner
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 1
  label_smoothing: 0.0
  use_amp: true                # mixed precision (big speed-up on RTX cards)
  max_grad_norm: 1.0           # gradient clipping; 0 disables it
  drop_rate: 0.0               # dropout before the classifier head
  early_stopping_patience: 5
  monitor_metric: "val_qwk"    # checkpoint selection metric
  imbalance_strategy: "weighted_loss"   # none | weighted_loss | oversample | both

augmentation:
  # Mild on purpose: haemorrhages and exudates are identified partly by COLOUR,
  # so aggressive colour jitter can destroy the signal we want the model to learn.
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_degrees: 15
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  hue: 0.0                     # keep hue fixed - it carries lesion information
  scale_min: 0.90              # RandomResizedCrop-style zoom range
  scale_max: 1.00

explain:
  method: "gradcam"
  target_layer: "auto"         # resolved per-backbone in code
  overlay_alpha: 0.4

app:
  title: "DR Screening Support Prototype"
  disclaimer: >
    ACADEMIC PROTOTYPE - NOT A MEDICAL DEVICE. This application is a
    student research project built for screening-support demonstration only.
    It is not validated for clinical use, must not be used for diagnosis,
    triage, or treatment decisions, and does not replace examination by a
    qualified ophthalmologist.
