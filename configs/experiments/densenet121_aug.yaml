# STRONGER-AUGMENTATION arm.
#
# Motivated by the Milestone 5 training curves, not by taste. All three runs
# overfit: train loss falls while validation loss climbs.
#
#     run               train loss   val loss (final)   val loss (best)
#     densenet121           0.384          1.050          0.783 @ ep6
#     resnet50              0.497          0.927          0.805 @ ep5
#     efficientnet_b3       0.364          1.770          0.911 @ ep3
#
# Note what overfits and what does not: validation LOSS rises while validation
# QWK stays roughly flat. The model is not getting worse at ordering images, it
# is getting more confidently wrong - the same finding the calibration module
# reached independently, where every fitted temperature came out above 1.
# Temperature scaling treats that symptom after the fact; this config attacks
# the cause.
#
# What changed from densenet121_long, and why each one is safe here:
#   rotate_degrees  15 -> 180   a fundus photograph has no canonical
#                               orientation, so ANY rotation preserves the
#                               label. Using 15 degrees was leaving free
#                               variety on the table.
#   scale_min     0.90 -> 0.70  lesion scale now genuinely varies; the old
#                               range was almost no zoom at all.
#   erase_p       0.00 -> 0.25  blanks a random patch, so the network cannot
#                               rest on one memorised region per image.
#
# What deliberately did NOT change: hue stays at 0.0, and brightness/contrast/
# saturation stay gentle. Diabetic retinopathy is graded partly from COLOUR -
# microaneurysms are dark red dots, hard exudates are pale yellow - and
# aggressive colour jitter destroys the signal the model needs. Illumination
# variation is better handled by fixing the preprocessing than by jittering it.
#
# Mixup was considered and left out: it needs changes inside the training loop
# and interacts awkwardly with the class-weighted loss, so it belongs in its own
# arm rather than being confounded with these three changes.
#
# Compare against: densenet121_long (same schedule, original augmentation).
# Expect this run to need MORE epochs - augmentation slows convergence, which is
# what the 45-epoch schedule and patience 12 are there for.
#
# Run:  python -m scripts.m4_train --experiment densenet121_aug

run_name: "densenet121_aug"

training:
  backbone: "densenet121"
  head: "classification"
  batch_size: 6
  grad_accum_steps: 3          # effective batch 18
  lr: 3.0e-4
  imbalance_strategy: "weighted_loss"

augmentation:
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_degrees: 180
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  hue: 0.0
  scale_min: 0.70
  scale_max: 1.00
  erase_p: 0.25
  erase_scale: [0.02, 0.15]
  erase_ratio: [0.3, 3.3]
