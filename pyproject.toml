# Minimal tooling config. Not a package build file - the project is run as
# scripts from the repo root, not installed.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # so `import src...` works inside tests
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]           # line length is handled by the formatter/ruler
